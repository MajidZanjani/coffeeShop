<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="format-detection" content="telephone=no"><title>Coffee House</title><link rel="icon" type="image/svg" href="./img/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet"><script defer="defer" src="bundle.c7b00f0838f9c1a01b3c.js"></script></head><body><div class="container"><header id="header"></header><main><div class="login-container"><div class="login-header">Registration</div><div class="loader"></div><form class="form" autocomplete="off" id="registration-form"><div class="register-wrap"><div class="user-wrap"><span>Login</span> <input id="user" id="login" class="user-name" autocomplete="off" placeholder="placeholder"><div id="login-error" class="hide"></div></div><div class="password-wrap"><span>Password</span> <input id="password" type="password" class="password" autocomplete="off" placeholder="placeholder"><div id="password-error" class="hide"></div></div><div class="password-wrap"><span>Confirm Password</span> <input id="confirm-password" type="password" class="password" autocomplete="off" placeholder="placeholder"><div id="confirm-password-error" class="hide"></div></div></div><div class="address-wrap"><div class="city-wrap select-wrapper"><span>City</span> <select id="city" class="form-input" id="city"><option value="">Select City</option><option value="City1">City1</option><option value="City2">City2</option><option value="City3">City3</option></select><div id="city-error" class="hide"></div></div><div class="street-wrap select-wrapper"><span>Street</span> <select id="street" class="form-input" id="street"><option value="">Select Street</option></select><div id="street-error" class="hide"></div></div><div class="house-wrap"><span>House number</span> <input type="number" id="house" min="1" placeholder="Enter house number"><div id="house-error" class="hide"></div></div><div class="payment-wrap"><span>Paid by</span><div class="radio"><div class="radio"><label><input id="payment-method-cash" type="radio" name="payment" value="cash" checked="checked"> <span class="custom-radio"></span> Cash</label> <label><input id="payment-method-card" type="radio" name="payment" value="card"> <span class="custom-radio"></span> Card</label></div></div></div></div><button type="submit" class="register-btn disabled-btn">Registration</button></form><div class="register-error"></div></div></main><footer id="footer"></footer></div></body></html>
