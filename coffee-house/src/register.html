<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">
  <title>Coffee House</title>
  <link rel="icon" type="image/svg" href="./img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">
    <header id="header"></header>
    <main>
      <div class="sign-in-container">
        <div class="sign-in-header">Registration</div>

        <form class="form" autocomplete="off">
          <div class="register-wrap">
            <div class="user-wrap">
              <span>Login</span>
              <input type="text" class="user-name" autocomplete="off" placeholder="placeholder">
            </div>
            <div class="password-wrap">
              <span>Password</span>
              <input id="password" type="password" class="password" autocomplete="off" placeholder="placeholder">
            </div>
            <div class="password-wrap">
              <span>Confirm Password</span>
              <input id="confirm-password" type="password" class="password" autocomplete="off"
                placeholder="placeholder">
            </div>
          </div>

          <div class="address-wrap">
            <div class="city-wrap">
              <span>City</span>
              <input type="text" class="city" autocomplete="off" placeholder="placeholder">
            </div>
            <div class="street-wrap">
              <span>Street</span>
              <input type="text" class="street" autocomplete="off" placeholder="placeholder">
            </div>
            <div class="house-wrap">
              <span>House number</span>
              <input type="text" class="house" autocomplete="off" placeholder="placeholder">
            </div>

            <div class="payment-wrap">
              <span>Paid by</span>
              <div class="radio">
                <div class="radio">
                  <label>
                    <input type="radio" name="payment" value="cash">
                    <span class="custom-radio"></span>
                    Cash
                  </label>

                  <label>
                    <input type="radio" name="payment" value="card">
                    <span class="custom-radio"></span>
                    Card
                  </label>
                </div>
              </div>
            </div>

          </div>
          <button type="submit" class="register-btn">Registration</button>
        </form>


      </div>


    </main>
    <footer id="footer"></footer>
  </div>
</body>

</html>
