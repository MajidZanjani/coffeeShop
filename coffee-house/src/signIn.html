<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">
  <title>Coffee House</title>
  <link rel="icon" type="image/svg" href="./img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">
    <header id="header"></header>
    <main>
      <div class="login-container">
        <div class="login-header">Sign In</div>

        <form class="form" autocomplete="off">
          <div class="user-wrap">
            <span>Login</span>
            <input id="login-user-name" type="text" class="user-name" autocomplete="off" placeholder="placeholder">
            <div id="login-error" class="hide"></div>
          </div>
          <div class="password-wrap">
            <span>Password</span>
            <input id="login-password" type="password" class="password" autocomplete="off" placeholder="placeholder">
            <div id="password-error" class="hide"></div>
          </div>
          <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="login-error">Incorrect login or password</div>

      </div>
    </main>
    <footer id="footer"></footer>
  </div>
</body>

</html>
